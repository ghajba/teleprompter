<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="12"/>

  <!-- Subtle glow ring -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Prompter Glass / Screen Frame -->
  <rect x="96" y="80" width="320" height="260" rx="28" fill="#1e293b" stroke="#334155" stroke-width="10"/>

  <!-- Scrolling Script Lines -->
  <rect x="136" y="126" width="240" height="18" rx="9" fill="#f8fafc"/>
  <rect x="136" y="166" width="190" height="18" rx="9" fill="#94a3b8"/>
  <rect x="136" y="206" width="220" height="18" rx="9" fill="#f8fafc"/>
  <rect x="136" y="246" width="160" height="18" rx="9" fill="#94a3b8"/>

  <!-- Eyeline Focus Bar (Active Glow) -->
  <rect x="80" y="197" width="352" height="6" rx="3" fill="#38bdf8"/>
  <polygon points="68,200 84,192 84,208" fill="#38bdf8"/>
  <polygon points="444,200 428,192 428,208" fill="#38bdf8"/>

  <!-- Stand & Base Support -->
  <path d="M256 340 L256 410" stroke="#475569" stroke-width="18" stroke-linecap="round"/>
  <path d="M180 410 L332 410" stroke="#475569" stroke-width="20" stroke-linecap="round"/>

  <!-- Play Indicator Accent -->
  <circle cx="366" cy="370" r="32" fill="url(#glowGrad)" />
  <polygon points="360,358 378,370 360,382" fill="#ffffff" />
</svg>
