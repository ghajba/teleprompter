<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teleprompter Web App</title>
  <meta name="description" content="A lightweight, privacy-focused, zero-dependency browser-based teleprompter designed for smooth 60+ FPS scrolling.">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/prompter.css">
  <link rel="stylesheet" href="css/sidebar.css">
</head>
<body>

  <!-- Floating Heads-Up Display (Status & Speed) -->
  <aside id="hud" class="prompter-hud" aria-live="polite">
    <span id="hudDot" class="hud-status-dot"></span>
    <span id="hudStatus">Paused</span>
    <span id="hudSpeed" class="hud-speed-badge">35 px/s</span>
  </aside>

  <!-- Floating Settings & Script Drawer Toggle -->
  <button id="drawerToggle" class="drawer-toggle-btn" aria-label="Open Settings and Script Editor">
    <svg viewBox="0 0 24 24">
      <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
    </svg>
    <span>Settings & Script</span>
  </button>

  <!-- Eyeline Guide (Visual Reading Anchor) -->
  <div id="eyelineBand" class="eyeline-band"></div>
  <div id="eyelineGuide" class="eyeline-guide">
    <div class="eyeline-pointer-left"></div>
    <div class="eyeline-pointer-right"></div>
  </div>

  <!-- Prompter Main Canvas -->
  <main id="prompterContainer" class="prompter-container">
    <div id="mirrorBox" class="prompter-mirror-box">
      <div class="prompter-viewport">
        <div id="prompterText" class="prompter-content"></div>
      </div>
    </div>
  </main>

  <!-- Collapsible Settings & Script Drawer -->
  <aside id="drawer" class="drawer" aria-label="Prompter configuration drawer">
    <header class="drawer-header">
      <h2 class="drawer-title">⚙️ Prompter Controls</h2>
      <button id="drawerClose" class="drawer-close-btn" aria-label="Close drawer">&times;</button>
    </header>

    <div class="drawer-body">
      <!-- Section 1: Script Editor -->
      <section class="drawer-section">
        <div class="control-header">
          <label for="scriptInput" class="section-label">Presentation Script</label>
          <span class="script-meta">
            <span id="wordCount">0 words</span> &bull; <span id="charCount">0 chars</span>
          </span>
        </div>
        <textarea id="scriptInput" class="script-textarea" placeholder="Paste or type your presentation script here..."></textarea>
      </section>

      <!-- Section 2: Playback Action Buttons -->
      <section class="drawer-section">
        <span class="section-label">Playback</span>
        <div class="btn-grid">
          <button id="btnPlayPause" class="btn-ctrl btn-primary">▶ Play</button>
          <button id="btnReset" class="btn-ctrl">↺ Reset Top</button>
        </div>
        <button id="btnFullscreen" class="btn-ctrl" style="margin-top: 0.4rem;">⛶ Toggle Fullscreen (F)</button>
      </section>

      <!-- Section 3: Speed Control -->
      <section class="drawer-section">
        <div class="control-header">
          <label for="speedSlider" class="section-label">Scroll Speed</label>
          <span id="speedValue" class="control-value">35 px/s</span>
        </div>
        <input type="range" id="speedSlider" min="5" max="150" step="1" value="35">
      </section>

      <!-- Section 4: Typography & Layout -->
      <section class="drawer-section">
        <span class="section-label">Display & Typography</span>

        <div class="control-row">
          <div class="control-header">
            <label for="fontSizeSlider">Font Size</label>
            <span id="fontSizeValue" class="control-value">48 px</span>
          </div>
          <input type="range" id="fontSizeSlider" min="24" max="96" step="2" value="48">
        </div>

        <div class="control-row" style="margin-top: 0.5rem;">
          <div class="control-header">
            <label for="marginSlider">Reading Column Width</label>
            <span id="marginValue" class="control-value">75 %</span>
          </div>
          <input type="range" id="marginSlider" min="40" max="100" step="5" value="75">
        </div>

        <div class="control-row" style="margin-top: 0.5rem;">
          <div class="control-header">
            <label for="eyelineSlider">Eyeline Position</label>
            <span id="eyelineValue" class="control-value">35 %</span>
          </div>
          <input type="range" id="eyelineSlider" min="15" max="70" step="1" value="35">
        </div>

        <!-- Mirror Toggle -->
        <div class="control-row" style="margin-top: 0.75rem;">
          <label class="toggle-switch-label">
            <span>Mirror Flip (Glass Rig)</span>
            <div class="switch">
              <input type="checkbox" id="mirrorToggle">
              <span class="slider-round"></span>
            </div>
          </label>
        </div>

        <!-- Font Family -->
        <div class="control-row" style="margin-top: 0.75rem;">
          <label for="fontFamilySelect" style="font-size: 0.85rem; margin-bottom: 0.25rem;">Font Family</label>
          <select id="fontFamilySelect" class="select-input">
            <option value="system-ui, -apple-system, sans-serif">Modern Sans-Serif (System)</option>
            <option value="Georgia, Cambria, 'Times New Roman', serif">Classic Serif (Georgia)</option>
            <option value="'Courier New', Courier, monospace">Monospace</option>
          </select>
        </div>

        <!-- Color Themes -->
        <div class="control-row" style="margin-top: 0.75rem;">
          <label style="font-size: 0.85rem; margin-bottom: 0.25rem;">Contrast Theme</label>
          <div class="theme-palette">
            <button type="button" class="theme-pill theme-dark" data-bg="#000000" data-text="#ffffff">Dark</button>
            <button type="button" class="theme-pill theme-amber" data-bg="#000000" data-text="#fbbf24">Amber</button>
            <button type="button" class="theme-pill theme-green" data-bg="#000000" data-text="#22c55e">Green</button>
            <button type="button" class="theme-pill theme-light" data-bg="#ffffff" data-text="#000000">Light</button>
          </div>
        </div>
      </section>

      <!-- Section 5: Keyboard Shortcuts Reference -->
      <section class="drawer-section">
        <span class="section-label">Keyboard Shortcuts</span>
        <div class="shortcut-list">
          <div class="shortcut-item"><span>Play / Pause</span><kbd>Space</kbd></div>
          <div class="shortcut-item"><span>Adjust Speed</span><kbd>&uarr; / &darr;</kbd> or <kbd>[ / ]</kbd></div>
          <div class="shortcut-item"><span>Reset to Top</span><kbd>R</kbd> or <kbd>Home</kbd></div>
          <div class="shortcut-item"><span>Toggle Fullscreen</span><kbd>F</kbd></div>
          <div class="shortcut-item"><span>Close Drawer</span><kbd>Esc</kbd></div>
        </div>
      </section>
    </div>

    <footer class="drawer-footer">
      <a href="https://github.com/sponsors/ghajba" target="_blank" rel="noopener noreferrer" style="color: #f43f5e; font-weight: 600; text-decoration: none;">💖 Sponsor</a>
      <a href="https://github.com/ghajba/teleprompter" target="_blank" rel="noopener noreferrer">GitHub &rarr;</a>
    </footer>
  </aside>

  <!-- Application Bootstrap -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
